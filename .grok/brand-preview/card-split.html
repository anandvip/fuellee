<!doctype html>
<html>
<head>
<meta charset="utf-8"/>
<style>
  @font-face {
    font-family: "Outfit";
    src: url("fonts/Outfit.ttf") format("truetype");
    font-weight: 100 900;
    font-display: block;
  }
  html, body { margin: 0; background: #EDF1F3; }
  .card { width: 1200px; height: 630px; display: flex; background: #EDF1F3; }
  .panel {
    width: 480px;
    flex: none;
    background: #15303F;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .mark { width: 360px; height: 360px; display: block; }
  .copy {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 80px 0 72px;
  }
  h1 {
    margin: 0;
    font-family: "Outfit", sans-serif;
    font-weight: 650;
    font-size: 104px;
    line-height: 0.88;
    letter-spacing: -0.045em;
    color: #15303F;
  }
  p {
    margin: 20px 0 0;
    max-width: 16em;
    font-family: "Outfit", sans-serif;
    font-weight: 500;
    font-size: 32px;
    line-height: 1.25;
    letter-spacing: -0.015em;
    color: #0B7361;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="panel">
      <svg class="mark" viewBox="0 0 64 64" aria-hidden="true">
        <path d="M 13.3 18.22 A 15.2 15.2 0 0 1 30.48 23.14" fill="none" stroke="#0B7361" stroke-width="5.5" stroke-linecap="round"/>
        <path d="M 18.77 17.3 L 18.84 13.3" fill="none" stroke="#EDF1F3" stroke-width="3.3" stroke-linecap="round"/>
        <path d="M 44.54 16.76 L 34.2 30 L 41.57 38.96 A 9.3 9.3 0 1 1 27.06 39.14 L 34.2 30" fill="none" stroke="#D8830B" stroke-width="7.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="copy">
      <h1>Fuellee</h1>
      <p>A quiet log for what the car costs.</p>
    </div>
  </div>
</body>
</html>
